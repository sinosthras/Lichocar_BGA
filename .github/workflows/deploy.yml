name: Deploy to BGA Studio

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Sync files to BGA
      uses: sshdeploy/deploy-action@v4.2.5
      with:
        server: studio.boardgamearena.com
        username: ${{ secrets.BGA_USERNAME }}
        PASSWORD: ${{ secrets.BGA_PASSWORD }}
        PORT: 22
        FOLDER: './'
        TARGET: '/var/tournoi/projects/lichocar/'
        SSH_CMD_ARGS: "-o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no"
