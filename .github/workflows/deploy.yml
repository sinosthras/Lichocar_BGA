name: Deploy to BGA Studio

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: SFTP Deploy to BGA
      uses: wlixcc/SFTP-Deploy-Action@v1.2.5
      with:
        host: studio.boardgamearena.com
        username: ${{ secrets.BGA_USERNAME }}
        password: ${{ secrets.BGA_PASSWORD }}
        port: 22
        local_path: './*'
        remote_path: '/var/tournoi/projects/lichocar/'
        sftp_only: true
