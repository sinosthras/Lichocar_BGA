name: Deploy to BGA Studio

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Sync files to BGA
      uses: easingthemes/ssh-deploy@v5.1.0
      with:
        REMOTE_HOST: studio.boardgamearena.com
        REMOTE_USER: ${{ secrets.BGA_USERNAME }}
        REMOTE_PORT: 22
        SOURCE: "./"
        TARGET: "/var/tournoi/projects/lichocar/"
        SCRIPT_BEFORE: |
          echo "Connecting to BGA..."
        SSH_PRIVATE_KEY: ""
        ARGS: "-rlptgoD --delete"
        SSH_CMD_ARGS: "-o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no"
